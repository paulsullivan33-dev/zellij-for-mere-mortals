site_name: Zellij for Mere Mortals
site_description: A terminal multiplexer that divides one window into panes and tabs, keeps your sessions running after you close the window or lose your connection, rebuilds arrangements from plain text layout files, and can bring a session back after a crash, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/zellij-for-mere-mortals/
